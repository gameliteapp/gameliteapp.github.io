<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>GameLite | Play HTML5 Games Online</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --secondary: #fd79a8;
            --dark: #1e1f29;
            --dark-light: #636e72;
            --light: #f5f6fa;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #d63031;
            --glass: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --blur: blur(10px);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header Styles */
        header {
            background: var(--glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 1000;
            animation: fadeIn 0.5s ease-out;
        }
        
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }
        
        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--dark);
            font-weight: 700;
            font-size: 24px;
        }
        
        .logo-icon {
            background: var(--primary);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
        }
        
        /* Search Bar */
        .search-container {
            flex: 1;
            max-width: 500px;
            margin: 0 30px;
            position: relative;
        }
        
        .search-bar {
            width: 100%;
            padding: 12px 20px;
            padding-right: 45px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }
        
        .search-bar:focus {
            outline: none;
            background: white;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.2);
        }
        
        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dark-light);
        }
        
        .close-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dark-light);
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }
        
        .close-icon:hover {
            color: var(--danger);
        }

        /* Mobile Menu Toggle */
.menu-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--dark);
    font-size: 24px;
    cursor: pointer;
    margin-left: 15px;
}
        
        /* User Navigation */
        .user-nav {
            display: flex;
            align-items: center;
        }
        
        .nav-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--dark);
            margin-left: 20px;
            font-weight: 500;
            position: relative;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .nav-link i {
            margin-right: 8px;
        }
        
        .favorites-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--secondary);
            color: white;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Main Content */
        .main-content {
            padding: 40px 0;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark);
            position: relative;
            display: inline-block;
        }
        
        section.all-games {
            margin-top: 50px;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 50px;
            height: 4px;
            background: var(--primary);
            border-radius: 2px;
        }
        
        .view-all {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
        }
        
        .view-all i {
            margin-left: 5px;
            transition: transform 0.3s;
        }
        
        .view-all:hover i {
            transform: translateX(3px);
        }
        
        /* Categories */
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            padding-bottom: 10px;
        }
        
        .categories::-webkit-scrollbar {
            height: 5px;
        }
        
        .categories::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }
        
        .category {
            padding: 8px 20px;
            background: white;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .category:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.1);
        }
        
        .category.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }
        
        .game-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
            animation: fadeIn 0.5s ease-out;
            animation-fill-mode: backwards;
        }
        
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(108, 92, 231, 0.2);
        }
        
        .game-thumbnail {
            position: relative;
            overflow: hidden;
        }
        
        .game-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .game-card:hover .game-thumbnail img {
            transform: scale(1.05);
        }
        
        .game-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            color: white;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .play-button {
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }
        
        .game-card:hover .play-overlay {
            opacity: 1;
        }
        
        .game-card:hover .play-button {
            transform: scale(1);
        }
        
        .game-info {
            padding: 16px;
        }
        
        .game-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .game-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--dark-light);
        }
        
        .game-rating {
            display: flex;
            align-items: center;
            color: var(--warning);
        }
        
        .game-rating i {
            margin-right: 3px;
        }
        
        .game-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
        }
        
        .btn {
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-play {
            background: var(--primary);
            color: white;
            flex: 1;
            margin-right: 8px;
        }
        
        .btn-play:hover {
            background: var(--primary-light);
        }
        
        .btn-favorite {
            width: 36px;
            height: 36px;
            background: var(--light);
            color: var(--dark-light);
            border-radius: 8px;
        }
        
        .btn-favorite.favorited {
            color: var(--secondary);
        }
        
        /* Game Viewer */
        .game-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }
        
        .game-viewer.active {
            display: flex;
        }
        
        .game-viewer-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
        }
        
        .game-viewer-title {
            color: white;
            font-size: 20px;
            font-weight: 600;
        }
        
        .game-viewer-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        
        .game-viewer-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .game-viewer-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .game-iframe {
            width: 100%;
            max-width: 900px;
            height: 70vh;
            border: none;
            border-radius: 12px;
            background: black;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .game-viewer-actions {
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        .btn-fullscreen {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
        }
        
        .btn-fullscreen i {
            margin-right: 8px;
        }
        
        /* Footer */
        footer {
            background: var(--dark);
            color: white;
            padding: 20px 0;
        }
        
        .footer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .footer-copyright {
            font-size: 14px;
            color: #b2bec3;
        }
        
        .footer-links {
            display: flex;
            gap: 20px;
        }
        
        .footer-links a {
            color: #b2bec3;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .footer-links a:hover {
            color: white;
        }
        
        /* Search results section */
        .search-results {
            display: none;
        }

        .search-results.active {
            display: block;
        }

        /* Hide sections when searching */
        .searching .recent-games,
        .searching .all-games,
        .searching .category-games,
        .searching .favorites-games,
        .searching .featured-games {
            display: none;
        }
        
        /* Category games section */
        .category-games {
            display: none;
        }
        
        .category-games.active {
            display: block;
        }
        
        /* Hide sections when category is selected */
        .category-selected .recent-games,
        .category-selected .all-games,
        .category-selected .favorites-games,
        .category-selected .featured-games {
            display: none;
        }
        
        /* Favorites games section */
        .favorites-games {
            display: none;
        }

        .favorites-games.active {
            display: block;
        }

        /* Hide sections when favorites is selected */
        .favorites-selected .recent-games,
        .favorites-selected .all-games,
        .favorites-selected .category-games,
        .favorites-selected .search-results,
        .favorites-selected .featured-games {
            display: none;
        }
        
        /* Featured games section */
        .featured-games {
            display: none;
        }

        .featured-games.active {
            display: block;
        }

        /* Hide sections when featured is selected */
        .featured-selected .recent-games,
        .featured-selected .all-games,
        .featured-selected .category-games,
        .featured-selected .search-results,
        .featured-selected .favorites-games {
            display: none;
        }
        
        /* Modal/Popup Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.3s ease-out;
            position: relative;
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--dark);
            margin: 0;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--dark-light);
            transition: color 0.3s;
        }
        
        .modal-close:hover {
            color: var(--danger);
        }
        
        .modal-content {
            padding: 20px;
        }
        
        .modal-content h2 {
            color: var(--primary);
            margin-top: 20px;
            margin-bottom: 10px;
        }
        
        .modal-content p {
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .modal-content ul {
            margin-bottom: 15px;
            padding-left: 20px;
        }
        
        .modal-content li {
            margin-bottom: 8px;
        }

/* Mobile Styles */
@media (max-width: 768px) {
    .games-grid {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 15px;
}

    .menu-toggle {
        display: block;
    }
    
    .user-nav {
        position: fixed;

        width: 100%;
        background: var(--glass);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        border-bottom: 1px solid var(--glass-border);
        flex-direction: column;
        padding: 15px 20px;
        transform: translateY(-150%);
        transition: transform 0.3s ease;
        z-index: 999;
    }
    
    .user-nav.active {
        transform: translateY(0);
        background: white;
    }
    
    .user-nav .nav-link {
        margin: 10px 0;
        padding: 10px;
    }
    
    .header-container {
        padding: 15px 0;
    }
    
    .search-container {
        margin: 0 15px;
    }
}

                    <p>We'd love to hear from you! Whether you have a question about our games, need technical support, or want to suggest a new feature, feel free to reach out.</p>
                    
                    <h3>Contact Information</h3>
                    <ul>
                        <li><strong>Email:</strong> contact@nexusgames.com</li>
                        <li><strong>Phone:</strong> (555) 123-4567</li>
                        <li><strong>Address:</strong> 123 Gaming Street, Gameville, GV 12345</li>
                    </ul>
                    
                    <h3>Support Hours</h3>
                    <p>Our support team is available Monday through Friday, 9:00 AM to 5:00 PM EST.</p>
                    
                    <h3>Feedback Form</h3>
                    <form id="contact-form">
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px;">Name:</label>
                            <input type="text" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
                        </div>
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px;">Email:</label>
                            <input type="email" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
                        </div>
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px;">Message:</label>
                            <textarea style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ddd; min-height: 100px;"></textarea>
                        </div>
                        <button type="submit" style="background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Send Message</button>
                    </form>
                `
            }
        };

        // DOM elements
        const gamesContainer = document.getElementById('games-container');
        const recentGamesContainer = document.getElementById('recent-games');
        const categoryGamesContainer = document.getElementById('category-games-container');
        const categoryGamesSection = document.getElementById('category-games');
        const categoryTitle = document.getElementById('category-title');
        const searchResultsContainer = document.getElementById('search-results-container');
        const searchResultsSection = document.getElementById('search-results');
        const menuToggle = document.getElementById('menu-toggle');
        const userNav = document.querySelector('.user-nav');
        const favoritesGamesContainer = document.getElementById('favorites-games-container');
        const favoritesGamesSection = document.getElementById('favorites-games');
        const featuredGamesContainer = document.getElementById('featured-games-container');
        const featuredGamesSection = document.getElementById('featured-games');
        const gameViewer = document.getElementById('game-viewer');
        const gameIframe = document.getElementById('game-iframe');
        const gameViewerTitle = document.getElementById('game-viewer-title');
        const gameViewerClose = document.getElementById('game-viewer-close');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const searchInput = document.querySelector('.search-bar');
        const searchIcon = document.querySelector('.search-icon');
        const closeIcon = document.querySelector('.close-icon');
        const categoryButtons = document.querySelectorAll('.category');
        const favoritesCount = document.querySelector('.favorites-count');
        const mainContent = document.querySelector('.main-content');
        const favoritesLink = document.getElementById('favorites-link');
        const featuredLink = document.getElementById('featured-link');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalContent = document.getElementById('modal-content');
        const modalClose = document.getElementById('modal-close');
        const footerLinks = document.querySelectorAll('.footer-link');

        // State management
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let recentlyPlayed = JSON.parse(localStorage.getItem('recentlyPlayed')) || [];
        let currentCategory = 'All Games';

        // Initialize the app
        function init() {
            renderGames();
            renderRecentlyPlayed();
            renderFeaturedGames();
            updateFavoritesCount();
            setupEventListeners();
        }
        
        // Mobile menu toggle
        menuToggle.addEventListener('click', function() {
    userNav.classList.toggle('active');
    
    // Change icon based on state
    const icon = this.querySelector('i');
    if (userNav.classList.contains('active')) {
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-times');
    } else {
        icon.classList.remove('fa-times');
        icon.classList.add('fa-bars');
    }
});

// Close mobile menu when clicking a nav link
document.querySelectorAll('.user-nav .nav-link').forEach(link => {
    link.addEventListener('click', function() {
        if (window.innerWidth <= 768) {
            userNav.classList.remove('active');
            const icon = menuToggle.querySelector('i');
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
        }
    });
});

        // Render all games
        function renderGames() {
            gamesContainer.innerHTML = '';
            
            const filteredGames = games.filter(game => {
                const matchesCategory = currentCategory === 'All Games' || game.category === currentCategory;
                return matchesCategory;
            });

            if (filteredGames.length === 0) {
                gamesContainer.innerHTML = '<p class="no-games">No games found in this category.</p>';
                return;
            }

            filteredGames.forEach((game, index) => {
                const isFavorite = favorites.includes(game.id);
                const gameCard = createGameCard(game, isFavorite);
                gameCard.style.animationDelay = `${index * 0.05}s`;
                gamesContainer.appendChild(gameCard);
            });
        }

        // Render category games
        function renderCategoryGames(category) {
            categoryGamesContainer.innerHTML = '';
            
            const filteredGames = games.filter(game => game.category === category);
            
            if (filteredGames.length === 0) {
                categoryGamesContainer.innerHTML = '<p class="no-games">No games found in this category.</p>';
                return;
            }

            filteredGames.forEach((game, index) => {
                const isFavorite = favorites.includes(game.id);
                const gameCard = createGameCard(game, isFavorite);
                gameCard.style.animationDelay = `${index * 0.05}s`;
                categoryGamesContainer.appendChild(gameCard);
            });
        }

        // Render search results
        function renderSearchResults() {
            searchResultsContainer.innerHTML = '';
            
            const searchTerm = searchInput.value.toLowerCase().trim();
            if (searchTerm === '') {
                // If search is empty, hide search results and show normal sections
                searchResultsSection.classList.remove('active');
                mainContent.classList.remove('searching');
                return;
            }

            // Show search results and hide normal sections
            searchResultsSection.classList.add('active');
            mainContent.classList.add('searching');

            const filteredGames = games.filter(game => {
                return game.title.toLowerCase().includes(searchTerm) || 
                       game.category.toLowerCase().includes(searchTerm);
            });

            if (filteredGames.length === 0) {
                searchResultsContainer.innerHTML = '<p class="no-games">No games found matching your search.</p>';
                return;
            }

            filteredGames.forEach((game, index) => {
                const isFavorite = favorites.includes(game.id);
                const gameCard = createGameCard(game, isFavorite);
                gameCard.style.animationDelay = `${index * 0.05}s`;
                searchResultsContainer.appendChild(gameCard);
            });
        }

        // Render recently played games
        function renderRecentlyPlayed() {
            recentGamesContainer.innerHTML = '';
            
            if (recentlyPlayed.length === 0) {
                recentGamesContainer.innerHTML = '<p class="no-games">Play some games to see them here!</p>';
                return;
            }

            const recentGamesData = recentlyPlayed.map(gameId => 
                games.find(game => game.id === gameId)
            ).filter(game => game).slice(0, 5);

            recentGamesData.forEach((game, index) => {
                const isFavorite = favorites.includes(game.id);
                const gameCard = createGameCard(game, isFavorite);
                gameCard.style.animationDelay = `${index * 0.05}s`;
                recentGamesContainer.appendChild(gameCard);
            });
        }

        // Render favorite games
        function renderFavorites() {
            favoritesGamesContainer.innerHTML = '';
            
            if (favorites.length === 0) {
                favoritesGamesContainer.innerHTML = '<p class="no-games">You have no favorite games yet. Click the heart icon on games to add them to favorites.</p>';
                return;
            }

            const favoriteGames = favorites.map(gameId => 
                games.find(game => game.id === gameId)
            ).filter(game => game);

            favoriteGames.forEach((game, index) => {
                const gameCard = createGameCard(game, true); // All these are favorites
                gameCard.style.animationDelay = `${index * 0.05}s`;
                favoritesGamesContainer.appendChild(gameCard);
            });
        }

        // Render featured games
        function renderFeaturedGames() {
            featuredGamesContainer.innerHTML = '';
            
            const featuredGames = games.filter(game => game.featured);
            
            if (featuredGames.length === 0) {
                featuredGamesContainer.innerHTML = '<p class="no-games">No featured games at the moment.</p>';
                return;
            }

            featuredGames.forEach((game, index) => {
                const isFavorite = favorites.includes(game.id);
                const gameCard = createGameCard(game, isFavorite);
                gameCard.style.animationDelay = `${index * 0.05}s`;
                featuredGamesContainer.appendChild(gameCard);
            });
        }

        // Create a game card element
        function createGameCard(game, isFavorite = false) {
            const gameCard = document.createElement('div');
            gameCard.className = 'game-card';
            gameCard.dataset.id = game.id;
            gameCard.dataset.category = game.category;
            gameCard.dataset.title = game.title.toLowerCase();

            gameCard.innerHTML = `
                <div class="game-thumbnail">
                    <img src="${game.thumbnail}" alt="${game.title}">
                    ${game.featured ? '<span class="game-badge">Featured</span>' : ''}
                    <div class="play-overlay">
                        <div class="play-button">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                </div>
                <div class="game-info">
                    <h3 class="game-title">${game.title}</h3>
                    <div class="game-meta">
                        <span>${game.category}</span>
                        <span class="game-rating">
                            <i class="fas fa-star"></i> ${game.rating}
                        </span>
                    </div>
                    <div class="game-actions">
                        <button class="btn btn-play">Play Now</button>
                        <button class="btn btn-favorite ${isFavorite ? 'favorited' : ''}">
                            <i class="fas fa-heart"></i>
                        </button>
                    </div>
                </div>
            `;

            return gameCard;
        }

        // Update favorites count badge
        function updateFavoritesCount() {
            favoritesCount.textContent = favorites.length;
        }

        // Show modal with page content
        function showModal(page) {
            if (pageContent[page]) {
                modalTitle.textContent = pageContent[page].title;
                modalContent.innerHTML = pageContent[page].content;
                modalOverlay.classList.add('active');
                
                // Focus the first input in the form if it exists
                const formInput = modalContent.querySelector('input');
                if (formInput) {
                    formInput.focus();
                }
            }
        }

        // Close modal
        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // Setup event listeners
        function setupEventListeners() {
            // Play game when clicking play button or play icon
            document.addEventListener('click', function(e) {
                const playBtn = e.target.closest('.btn-play');
                const playOverlay = e.target.closest('.play-overlay');
                const favoriteBtn = e.target.closest('.btn-favorite');
                
                if (playBtn || playOverlay) {
                    const gameCard = (playBtn || playOverlay).closest('.game-card');
                    const gameId = parseInt(gameCard.dataset.id);
                    const game = games.find(g => g.id === gameId);
                    
                    if (game) {
                        playGame(game);
                    }
                }
                
                if (favoriteBtn) {
                    const gameCard = favoriteBtn.closest('.game-card');
                    const gameId = parseInt(gameCard.dataset.id);
                    toggleFavorite(gameId, favoriteBtn);
                }
            });
            
            // Close game viewer
            gameViewerClose.addEventListener('click', closeGameViewer);
            
            // Fullscreen button
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            
            // Search functionality
            searchInput.addEventListener('input', function() {
                const hasText = this.value.trim() !== '';
                
                // Toggle icons based on whether there's text
                if (hasText) {
                    searchIcon.style.display = 'none';
                    closeIcon.style.display = 'block';
                } else {
                    searchIcon.style.display = 'block';
                    closeIcon.style.display = 'none';
                }
                
                renderSearchResults();
            });
            
            // Close icon click handler
            closeIcon.addEventListener('click', function() {
                searchInput.value = '';
                searchIcon.style.display = 'block';
                closeIcon.style.display = 'none';
                renderSearchResults();
            });
            
            // Category filters
            categoryButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const category = this.dataset.category;
                    
                    // If we're in search mode, clear the search
                    if (searchInput.value.trim() !== '') {
                        searchInput.value = '';
                        searchIcon.style.display = 'block';
                        closeIcon.style.display = 'none';
                        searchResultsSection.classList.remove('active');
                        mainContent.classList.remove('searching');
                    }
                    
                    // If we're in favorites mode, exit it
                    if (favoritesGamesSection.classList.contains('active')) {
                        mainContent.classList.remove('favorites-selected');
                        favoritesGamesSection.classList.remove('active');
                    }
                    
                    // If we're in featured mode, exit it
                    if (featuredGamesSection.classList.contains('active')) {
                        mainContent.classList.remove('featured-selected');
                        featuredGamesSection.classList.remove('active');
                    }
                    
                    categoryButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.textContent;
                    
                    if (category === 'all') {
                        // Show all games and hide category section
                        mainContent.classList.remove('category-selected');
                        categoryGamesSection.classList.remove('active');
                        renderGames();
                    } else {
                        // Show category games and hide other sections
                        mainContent.classList.add('category-selected');
                        categoryGamesSection.classList.add('active');
                        categoryTitle.textContent = currentCategory;
                        renderCategoryGames(category);
                    }
                });
            });
            
            // Favorites link click handler
            favoritesLink.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Clear any active states
                categoryButtons.forEach(btn => btn.classList.remove('active'));
                categoryButtons[0].classList.add('active'); // Set "All Games" as active
                currentCategory = 'All Games';
                
                // Clear search if active
                if (searchInput.value.trim() !== '') {
                    searchInput.value = '';
                    searchIcon.style.display = 'block';
                    closeIcon.style.display = 'none';
                    searchResultsSection.classList.remove('active');
                    mainContent.classList.remove('searching');
                }
                
                // Exit featured mode if active
                if (featuredGamesSection.classList.contains('active')) {
                    mainContent.classList.remove('featured-selected');
                    featuredGamesSection.classList.remove('active');
                }
                
                // Toggle favorites view
                mainContent.classList.toggle('favorites-selected');
                favoritesGamesSection.classList.toggle('active');
                
                // Only render favorites if we're showing the favorites section
                if (favoritesGamesSection.classList.contains('active')) {
                    renderFavorites();
                } else {
                    // If toggling off, show the normal view
                    mainContent.classList.remove('category-selected');
                    categoryGamesSection.classList.remove('active');
                    renderGames();
                }
            });
            
            // Featured link click handler
            featuredLink.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Clear any active states
                categoryButtons.forEach(btn => btn.classList.remove('active'));
                categoryButtons[0].classList.add('active'); // Set "All Games" as active
                currentCategory = 'All Games';
                
                // Clear search if active
                if (searchInput.value.trim() !== '') {
                    searchInput.value = '';
                    searchIcon.style.display = 'block';
                    closeIcon.style.display = 'none';
                    searchResultsSection.classList.remove('active');
                    mainContent.classList.remove('searching');
                }
                
                // Exit favorites mode if active
                if (favoritesGamesSection.classList.contains('active')) {
                    mainContent.classList.remove('favorites-selected');
                    favoritesGamesSection.classList.remove('active');
                }
                
                // Toggle featured view
                mainContent.classList.toggle('featured-selected');
                featuredGamesSection.classList.toggle('active');
                
                // Only render featured if we're showing the featured section
                if (featuredGamesSection.classList.contains('active')) {
                    renderFeaturedGames();
                } else {
                    // If toggling off, show the normal view
                    mainContent.classList.remove('category-selected');
                    categoryGamesSection.classList.remove('active');
                    renderGames();
                }
            });
            
            // Footer links click handlers
            footerLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const page = this.dataset.page;
                    showModal(page);
                });
            });
            
            // Modal close button
            modalClose.addEventListener('click', closeModal);
            
            // Close modal when clicking outside content
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });
            
            // Close modal with Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });
        }

 function playGame(game) {
    // Show loading state
    gameIframe.src = "";
    gameViewerTitle.textContent = `Loading ${game.title}...`;
    gameViewer.classList.add('active');
    
    // Add error event listener
    gameIframe.onerror = function() {
        gameViewerTitle.textContent = `Error loading ${game.title}`;
        // You could also show a message in the iframe or a retry button
    };
    
    // Set the iframe source after setting up error handling
    gameIframe.src = game.embed.match(/src="([^"]+)"/)[1];
    
    // Add to recently played
    addToRecentlyPlayed(game.id);
}

        // Close game viewer
        function closeGameViewer() {
            gameViewer.classList.remove('active');
            gameIframe.src = '';
        }

        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                gameViewer.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Toggle favorite
        function toggleFavorite(gameId, button) {
            const index = favorites.indexOf(gameId);
            
            if (index === -1) {
                favorites.push(gameId);
                button.classList.add('favorited');
            } else {
                favorites.splice(index, 1);
                button.classList.remove('favorited');
            }
            
            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavoritesCount();
            
            // If favorites view is active, update it
            if (favoritesGamesSection.classList.contains('active')) {
                renderFavorites();
            }
        }

        // Add to recently played
        function addToRecentlyPlayed(gameId) {
            // Remove if already exists
            const index = recentlyPlayed.indexOf(gameId);
            if (index !== -1) {
                recentlyPlayed.splice(index, 1);
            }
            
            // Add to beginning
            recentlyPlayed.unshift(gameId);
            
            // Keep only the last 5 games
            if (recentlyPlayed.length > 5) {
                recentlyPlayed = recentlyPlayed.slice(0, 5);
            }
            
            localStorage.setItem('recentlyPlayed', JSON.stringify(recentlyPlayed));
            renderRecentlyPlayed();
        }

        // Initialize the app
        init();
    </script>
</body>
</html>
